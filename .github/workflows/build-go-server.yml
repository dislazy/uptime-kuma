# go_server Docker 镜像构建与推送
#
# 产物：ghcr.io/<owner>/uptime-kuma-go
#
# 触发策略（2026-11-21 调整：只在发版时构建镜像）：
#   - push 到 main（go_server/** 或前端文件变化） → 只跑校验（vet + go test），不构建
#   - 推送 v* tag（或手动 dispatch）              → 校验 + 构建多架构镜像 + 推送
#
# 镜像标签（仅发版构建产生）：
#   x.y.z / x.y / x（来自 tag）、latest、sha-<短sha>
#   需要"某次 main 提交的镜像"时手动 dispatch 一次，用 sha-<短sha> 固定。
#
# 设计说明：编译全部在 runner 原生环境完成（日志可见、无 QEMU 模拟编译、可断点定位）：
#   job verify → go vet + go test（commit 与 tag 都跑）
#   job web    → npm run build → dist/
#   job bin    → setup-go + go build 交叉编译（amd64 / arm64 矩阵）
#   job image  → 把产物装进镜像（go_server/Dockerfile.ci，纯 COPY 无编译）
# 本地全流程自包含构建仍可用 go_server/Dockerfile（多阶段、源码进镜像）。

name: Build Go Server Image

on:
  push:
    branches: [main]
    paths:
      - "go_server/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "index.html"
      - "vite.config.mjs"
      - "tsconfig.json"
      - "src/**"
      - "public/**"
      - ".github/workflows/build-go-server.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-go-server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/uptime-kuma-go

jobs:
  # ---------- 校验（所有触发都跑） ----------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 显式固定版本，不用 go-version-file：
          # go-version-file 曾出现过"秒成功但实际没装对版本"的情况，
          # 导致 go build 因 `go.mod requires go >= 1.26.0` 立即退出。
          go-version: "1.26.0"
          cache-dependency-path: go_server/go.sum

      - name: Go diagnostics
        run: |
          which go
          go version
          go env GOTOOLCHAIN GOPROXY GOFLAGS GOMODCACHE GOCACHE

      - name: gofmt
        working-directory: go_server
        run: |
          out=$(gofmt -l internal/ cmd/)
          if [ -n "$out" ]; then
            echo "::error::以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: Vet
        working-directory: go_server
        run: go vet ./...

      - name: Test
        working-directory: go_server
        # MySQL 集成测试与 e2e 脚本默认 skip，这里不会连外部数据库
        run: go test ./... -count=1

  # ---------- 前端（仅发版） ----------
  web:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 3

  # ---------- Go 二进制（仅发版；amd64 / arm64 矩阵，原生交叉编译） ----------
  bin:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare version info
        id: meta
        run: |
          # 发版构建以 tag 为准：镜像标签是 3.1.0，界面上也必须报 3.1.0，
          # 否则 /api/info 里还是 package.json 的 3.0.0-beta.1，排查问题时对不上。
          # 手动 dispatch 没有 tag，回落到 package.json 版本。
          # 注意 package.json 必须与 upstream 保持一致（见 MAINTAINING.md 分支模型），
          # 所以不能靠改它来发版。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BASE="${GITHUB_REF_NAME#v}"
          else
            BASE=$(grep -m1 '"version"' package.json | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "VERSION=${BASE}-go.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: go_server/go.sum

      - name: Build binary (linux/${{ matrix.arch }})
        working-directory: go_server
        env:
          VERSION: ${{ steps.meta.outputs.VERSION }}
          COMMIT: ${{ steps.meta.outputs.SHORT_SHA }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -trimpath \
            -ldflags="-s -w -X github.com/dislazy/uptime-kuma/go_server/internal/version.Version=${VERSION} -X github.com/dislazy/uptime-kuma/go_server/internal/version.Commit=${COMMIT}" \
            -o "../go_server-linux-${{ matrix.arch }}" ./cmd/go_server

      - uses: actions/upload-artifact@v4
        with:
          name: go_server-linux-${{ matrix.arch }}
          path: go_server-linux-*
          retention-days: 3

  # ---------- 组装镜像并推送（仅发版） ----------
  image:
    needs: [web, bin]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: docker-ci/dist

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: go_server-linux-*
          path: docker-ci
          merge-multiple: true

      - name: Prepare build context
        run: |
          cp go_server/Dockerfile.ci docker-ci/Dockerfile
          # download-artifact 不保留可执行位，显式补上（Dockerfile.ci 里也有 chmod 兜底）
          chmod +x docker-ci/go_server-linux-*
          ls -lh docker-ci/ docker-ci/dist | head -20
          test -f docker-ci/go_server-linux-amd64
          test -f docker-ci/go_server-linux-arm64
          test -f docker-ci/dist/index.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,pattern=sha-{{short}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-ci
          file: ./docker-ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          # 不要传 TARGETARCH：它由 buildx 按 platform 自动注入，
          # 显式传 amd64 会让 arm64 镜像里塞进 amd64 二进制（exec format error）。

      - name: Smoke test (amd64)
        run: |
          TAG="${IMAGE}:sha-${GITHUB_SHA::7}"
          docker run -d --name kuma-smoke -p 13001:3001 "$TAG" || true
          sleep 3
          {
            echo "## Smoke diagnostics"
            echo '```'
            echo "--- docker images ---"
            docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep uptime-kuma-go
            echo "--- docker ps ---"
            docker ps -a --filter name=kuma-smoke
            echo "--- docker inspect state ---"
            docker inspect kuma-smoke --format 'State={{.State.Status}} ExitCode={{.State.ExitCode}} OOM={{.State.OOMKilled}}' || true
            echo "--- docker logs ---"
            docker logs kuma-smoke 2>&1 || true
            echo "--- curl ---"
            curl -sv --max-time 5 http://localhost:13001/api/health 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:13001/api/health | grep -q '"ok":true'; then
              echo "healthcheck OK"
              docker rm -f kuma-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::容器健康检查未通过，诊断信息已写入 job summary"
          docker rm -f kuma-smoke > /dev/null
          exit 1
